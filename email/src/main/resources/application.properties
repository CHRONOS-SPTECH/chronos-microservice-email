server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/msemail?createDatabaseIfNotExist=true
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=seuEmail
spring.mail.password=xxxx xxxx xxxx xxxx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# RabbitMQ: configure credentials through environment variables outside local development.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false

app.rabbitmq.exchange=${EMAIL_RABBITMQ_EXCHANGE:email.exchange}
app.rabbitmq.queue=${EMAIL_RABBITMQ_QUEUE:email.send.queue}
app.rabbitmq.routing-key=${EMAIL_RABBITMQ_ROUTING_KEY:email.send}
app.rabbitmq.dead-letter-exchange=${EMAIL_RABBITMQ_DLX:email.dlx}
app.rabbitmq.dead-letter-queue=${EMAIL_RABBITMQ_DLQ:email.send.dlq}
app.rabbitmq.dead-letter-routing-key=${EMAIL_RABBITMQ_DLQ_ROUTING_KEY:email.send.dead}
app.rabbitmq.enabled=${EMAIL_RABBITMQ_ENABLED:false}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=5s
spring.rabbitmq.max-inbound-message-body-size=1048576
